<g font-family="Arial, Helvetica, sans-serif" fill="#1c2922"><text x="64" y="876" font-size="16">Recommended: A — keep the two-stone silhouette, let the number live inside it.</text><text x="64" y="907" font-size="12" fill="#6a726a">Concept study. Small-size optical correction and trademark similarity review remain outstanding.</text></g>
