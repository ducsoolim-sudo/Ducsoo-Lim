<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" role="img" aria-labelledby="title desc">
<title id="title">13GO — two stones, three ways to carry thirteen</title>
<desc id="desc">Three refinements of the selected two-stone mark. A has a serif one in the dark stone and a three in the outlined stone; B places a compact thirteen at their meeting; C keeps the stones clean with thirteen below. Light, reversed, twenty-four and forty-eight pixel studies. Concepts, not an installed app logo.</desc>
