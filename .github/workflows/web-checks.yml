name: Web regression checks
on:
  push:
    branches: [test-menu-v11]
  pull_request:
    branches: [test-menu-v11]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install server test dependencies
        run: python -m pip install -r requirements.txt
      - name: Server regression tests
        run: python -m unittest discover -q
      - name: Browser logic regression tests
        shell: bash
        run: |
          for test_file in test_*.cjs; do
            node "$test_file"
          done
      - name: Recover a game after killing and restarting the server
        timeout-minutes: 2
        run: python verify_restart_process.py
