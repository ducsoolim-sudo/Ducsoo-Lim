name: Native preview compile
on:
  push:
    branches: [test-menu-v11]
    paths: [native-preview-source.zip, .github/workflows/native-preview.yml]
permissions:
  contents: read
concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
          - target: ios
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and unpack source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          source=pathlib.Path('native-preview-source.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '799789451ea96a980d7cb39e092d9c16e7dda23a58d8f0c255cb99989c577135'
          with zipfile.ZipFile(source) as archive:
              archive.extractall('native-source')
          PY
          chmod +x native-source/mobile/android/gradlew
          python3 -m venv native-source/.venv
          native-source/.venv/bin/python -m pip install -r native-source/requirements.txt
          echo "$GITHUB_WORKSPACE/native-source/.venv/bin" >> "$GITHUB_PATH"
      - name: Install and check modules
        working-directory: native-source/mobile
        run: |
          npm ci
          npm run sync:bundled
          npm run check
      - name: Compile native preview
        working-directory: native-source/mobile
        run: npm run build:${{ matrix.target }} -- --bundled
      - name: Pack unsigned iOS simulator app
        if: matrix.target == 'ios'
        run: tar -czf 13GO-ios-simulator.tar.gz -C native-source/mobile/build/ios-simulator/Build/Products/Debug-iphonesimulator App.app
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'android'
        with:
          name: 13GO-Android-debug
          path: native-source/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'ios'
        with:
          name: 13GO-iOS-simulator
          path: 13GO-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
