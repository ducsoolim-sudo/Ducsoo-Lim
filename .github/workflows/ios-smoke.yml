name: iOS simulator runtime check
on:
  push:
    branches: [test-menu-v11]
    paths: [.github/workflows/ios-smoke.yml, ios-smoke-setup.rb, ios-smoke-test.swift, native-preview-source-v3.zip, apply-native-runtime-fix.py]
permissions:
  contents: read
concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare pinned source and UI test target
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          source=pathlib.Path('native-preview-source-v3.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'dbf7d6a0ed3ce80a7ee51167d3e63937ce43a668dc561a4d6d5390f74906fc50'
          with zipfile.ZipFile(source) as archive:
              archive.extractall('native-source')
          PY
          python3 apply-native-runtime-fix.py
          gem install --user-install xcodeproj --no-document
          ruby ios-smoke-setup.rb
          cd native-source/mobile
          npm ci
          npm run sync:bundled
          npm run check
